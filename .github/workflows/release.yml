# On a version tag (v0.1.0...): test, build the ZIP and attach it to a GitHub
# release. Nothing is uploaded anywhere else.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/package.py --check
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          draft: true
