# Runs the headless test suite (real Lua 5.1 through the lupa package) and
# builds the ZIP on every push and pull request. Nothing opens a game or a window.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lua 5.1 (lupa bundles the interpreter WoW's Lua is based on)
        run: pip install lupa==2.8

      - name: Run tests
        run: python tools/run_tests.py

      - name: Build and check the ZIP
        run: python tools/package.py --check

      - uses: actions/upload-artifact@v4
        with:
          name: HarvestMateEnhanced-zip
          path: dist/*.zip
